name: Feature request
description: Suggest a routing mode, protocol, integration, or operational improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should LLM Router do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auto routing
        - OpenAI-compatible API
        - Streaming
        - Tools / function calling
        - Multimodal
        - CLI / install experience
        - Docs
        - Other
    validations:
      required: true
