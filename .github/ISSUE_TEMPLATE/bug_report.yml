name: Bug report
description: Report a reproducible problem in LLM Router.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove API keys and sensitive prompts from logs before sharing.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which version, commit, or Docker image are you running?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest request or config that reproduces the issue.
      placeholder: |
        1. Configure ...
        2. Send ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant sanitized logs. Do not include API keys.
      render: shell
